version: '3.8'

services:
  web:
    build: .
    container_name: personal_expense_tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=ai-personal-expense-tracker-docker-secret-2026
      - PORT=5000
    volumes:
      - ./database:/app/database
      - ./data:/app/data
