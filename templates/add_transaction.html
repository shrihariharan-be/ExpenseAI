{% extends "base.html" %}

{% block title %}Add Transaction - Personal Expense Tracker{% endblock %}
{% block header_title %}Add New Transaction{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header">
        <h2 class="card-header-title">
          <i class="fa-solid fa-circle-plus text-primary"></i>
          <span>Transaction Details</span>
        </h2>
        <a href="{{ url_for('transactions') }}" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i> Back
        </a>
      </div>

      <div class="card-body p-4">
        <form action="{{ url_for('add_transaction') }}" method="POST" id="transactionForm" novalidate>
          <div class="row g-3">
            <!-- Transaction Type -->
            <div class="col-12 col-sm-6">
              <label for="type" class="form-label">Transaction Type <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-arrow-right-arrow-left text-muted"></i></span>
                <select class="form-select" id="type" name="type" required>
                  <option value="Expense" {% if form_data.type == 'Expense' or not form_data.type %}selected{% endif %}>Expense</option>
                  <option value="Income" {% if form_data.type == 'Income' %}selected{% endif %}>Income</option>
                </select>
              </div>
            </div>

            <!-- Date -->
            <div class="col-12 col-sm-6">
              <label for="date" class="form-label">Transaction Date <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-calendar text-muted"></i></span>
                <input type="date" class="form-control" id="date" name="date" value="{{ form_data.date or default_date }}" required>
              </div>
            </div>

            <!-- Category (Dynamic) -->
            <div class="col-12 col-sm-6">
              <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-tags text-muted"></i></span>
                <select class="form-select" id="category" name="category" required>
                  <!-- Populated dynamically via JS -->
                </select>
              </div>
            </div>

            <!-- Amount -->
            <div class="col-12 col-sm-6">
              <label for="amount" class="form-label">Amount (₹) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text">₹</span>
                <input type="number" step="0.01" min="0.01" class="form-control" id="amount" name="amount" placeholder="0.00" value="{{ form_data.amount or '' }}" required>
              </div>
            </div>

            <!-- Description -->
            <div class="col-12">
              <label for="description" class="form-label">Description (Optional)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-comment-dots text-muted"></i></span>
                <input type="text" class="form-control" id="description" name="description" placeholder="e.g. Grocery shopping, Freelance invoice #102..." value="{{ form_data.description or '' }}">
              </div>
            </div>

            <!-- Buttons -->
            <div class="col-12 mt-4 pt-2 d-flex justify-content-end gap-2">
              <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary px-4">Cancel</a>
              <button type="submit" class="btn btn-primary px-4 d-flex align-items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Save Transaction</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const initialCategory = "{{ form_data.category or '' }}";
    setupCategoryDropdown('type', 'category', initialCategory);
  });
</script>
{% endblock %}
